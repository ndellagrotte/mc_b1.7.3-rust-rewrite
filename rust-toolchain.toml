# Records the stable toolchain this project is built with (PLAN_v4 D6).
#
# The Arch system toolchain (`pacman` package `rust`) ignores this file; it
# exists for `rustup` users and for CI, which read it automatically. The wasm
# target is listed so that `rustup` installs it for the D9 browser check
# (`cargo check -p mc-core -p mc-nbt -p mc-sim --target wasm32-unknown-unknown`).
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
