[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "CC0-1.0" # the template's LICENSE; the owner may change it later

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d", "3d", "ui"] }
bevy_kira_audio = "0.26"
bevy_asset_loader = "0.27.0"
blake3 = "1" # mc-golden digests (ADR-007 §5.2)
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# keep the following in sync with Bevy's dependencies (template note)
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

[workspace.lints.clippy]
excessive_precision = "allow" # transcribed Java float literals keep their digits (PLAN_v4 D4)
approx_constant = "allow"
disallowed_types = "deny"
disallowed_methods = "deny"

# Profiles must live at the workspace root; cargo ignores them in member crates.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
