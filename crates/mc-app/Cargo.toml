[package]
name = "mc-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Binary entry point: window and icon setup around mc-client"

[[bin]]
name = "mc_b173"
path = "src/main.rs"

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
mc-client = { path = "../mc-client" }
bevy.workspace = true
# libwayland-client is dlopen'd (winit's default), so portable Linux builds do not link it (tools/portable)
winit = { workspace = true, features = ["wayland-dlopen"] }
image.workspace = true
log.workspace = true

[build-dependencies]
embed-resource = "1"

[lints]
workspace = true
