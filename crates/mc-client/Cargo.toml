[package]
name = "mc-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Bevy client for the Beta 1.7.3 rewrite: window, input, rendering, UI, audio, assets"

[dependencies]
mc-core = { path = "../mc-core" }
mc-sim = { path = "../mc-sim" }
bevy.workspace = true
bevy_kira_audio.workspace = true
# Streaming playback of music and records (WP-3.8, sound::StreamOutput):
# bevy_kira_audio plays only fully decoded sounds. The same kira as
# bevy_kira_audio's (0.12, `cpal`; its `ogg` feature unifies in).
kira = { version = "0.12.1", default-features = false, features = ["cpal"] }
bevy_asset_loader.workspace = true
# PNG decoding of the jar's textures (D8: read at runtime, never embedded).
image = { workspace = true, features = ["png"] }
log.workspace = true
# The scripted-input dev mode's script and dump files (WP-3.1).
serde.workspace = true
serde_json.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
# `localtime_r` for the screenshot file name (ScreenShotHelper's local-time
# `SimpleDateFormat`); std has no time-zone access.
libc = "0.2"

[lints]
workspace = true
