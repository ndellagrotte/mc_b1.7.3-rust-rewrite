[package]
name = "mc-sim"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Plain-Rust simulation of Minecraft Beta 1.7.3: blocks, items, world, generation, entities, inventory, saves"

[dependencies]
mc-core = { path = "../mc-core" }
mc-nbt = { path = "../mc-nbt" }
# The stats file's JSON (StatFileWriter.func_27177_a; Argo replaced per PLAN_v4 §5).
serde_json.workspace = true
# The stats file's parse tree keeps each object's fields in document order
# (Argo's builder list; serde_json's `Value` sorts them): a `Visitor`.
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
# tests/golden_tick.rs: the golden-fixture runner and tick driver (a dev-only
# cycle, mc-golden depends on mc-sim; cargo allows it for dev-dependencies).
mc-golden = { path = "../mc-golden" }
# tests/golden_block_table.rs builds its trace lines as JSON values;
# tests/golden_item_table.rs reads the scenario\'s kind-specific fields.
serde_json.workspace = true
